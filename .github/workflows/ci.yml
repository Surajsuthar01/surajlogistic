name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: suraj_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d suraj_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests on embedded Postgres
        run: npm test
      - name: API tests on real PostgreSQL
        run: npm test -w @suraj/api
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/suraj_test
      - run: npm run build
      - run: npm run build:demo

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t surajlogistic-api .
      - run: docker build -f apps/web/Dockerfile -t surajlogistic-web .
